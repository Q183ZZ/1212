  // ============================================================
  // 第三批：耀宝智能控制层
  // ------------------------------------------------------------
  // AI 不直接计算地图路线；它负责理解用户意图，再调用现有搜索/规划能力。
  // ============================================================
  function extractNavigationPreference(text) {
    var t = (text || '').trim();
    var rules = [
      { re: /不要.*高速|不走高速|避开高速/, tag: '高速少' },
      { re: /多.*高速|优先高速|走高速/, tag: '高速多' },
      { re: /少.*红绿灯|避开红绿灯/, tag: '红绿灯少' },
      { re: /风景|好看|景色/, tag: '风景好' },
      { re: /新手|容易开/, tag: '新手友好' }
    ];
    for (var i=0;i<rules.length;i++) if (rules[i].re.test(t)) return rules[i].tag;
    return '';
  }

  function applyNaturalNavigationPreference(text) {
    var tag = extractNavigationPreference(text);
    if (!tag) return false;
    applyTagsFromAI([tag]);
    showToast('耀宝已调整路线偏好：' + tag, 'success');
    if (routePath.length && document.getElementById('startPoint').value.trim() && document.getElementById('endPoint').value.trim()) {
      setTimeout(function(){ planRoute({speak:false}); }, 150);
    }
    return true;
  }

  // 第五批：地点记忆，使用 localStorage 保存家/公司/收藏地点。
  var placeMemory = JSON.parse(localStorage.getItem('yaowangPlaceMemory') || '{}');
  var favoritePlaces = JSON.parse(localStorage.getItem('yaowangFavoritePlaces') || '[]');

  function savePlaceMemory(type, value) {
    value = (value || '').trim();
    if (!value) return;
    if (type === 'favorite') {
      if (!favoritePlaces.some(function(x){return x.name === value;})) favoritePlaces.push({name:value, time:Date.now()});
      localStorage.setItem('yaowangFavoritePlaces', JSON.stringify(favoritePlaces));
    } else {
      placeMemory[type] = value;
      localStorage.setItem('yaowangPlaceMemory', JSON.stringify(placeMemory));
    }
  }

  function usePlaceMemory(type) {
    if (type === 'favorite') {
      if (!favoritePlaces.length) { showToast('还没有收藏地点'); return; }
      var names = favoritePlaces.slice(-5).map(function(x){return x.name;});
      document.getElementById('endPoint').value = names[names.length - 1];
      showToast('已使用最近收藏地点：' + names[names.length - 1], 'success');
      return;
    }
    if (!placeMemory[type]) { showToast(type === 'home' ? '还没有保存“家”' : '还没有保存“公司”'); return; }
    document.getElementById('endPoint').value = placeMemory[type];
    showToast('已填入：' + placeMemory[type], 'success');
  }

  function enhanceMemoryFromRoute() {
    if (!currentRouteData) return;
    // 只有用户明确要求时才保存，避免未经同意记录地点。
    var to = currentRouteData.to || '';
    if (/^(家|回家)$/.test(to)) savePlaceMemory('home', to);
    if (/^(公司|上班)$/.test(to)) savePlaceMemory('work', to);
  }

  document.querySelectorAll('.memory-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ usePlaceMemory(this.getAttribute('data-memory')); });
  });

  // 让“家/公司/收藏”可以被耀宝直接理解。
  function resolveMemoryAlias(text) {
    var t = (text || '').trim();
    if (/回家|去家里/.test(t) && placeMemory.home) return placeMemory.home;
    if (/去公司|去上班/.test(t) && placeMemory.work) return placeMemory.work;
    return '';
  }

  // 第四批：增强导航状态展示和路线信息，保持基础地图导航与 AI 解耦。
  function updateNavigationMetrics() {
    var result = document.getElementById('routeResult');
    if (!result || !currentRouteData) return;
    var metric = result.querySelector('.nav-metric');
    if (!metric) {
      metric = document.createElement('div');
      metric.className = 'nav-metric';
      result.appendChild(metric);
    }
    metric.innerHTML = '<span>状态：' + escapeHtml(navigationState) + '</span><span>实时追踪：' + (liveNavigating ? '开启' : '未开启') + '</span>';
  }

  var _setNavigationState = setNavigationState;
  setNavigationState = function(nextState, reason) {
    _setNavigationState(nextState, reason);
    updateNavigationMetrics();
  };

  // 第五批：保存路线成功后保留最近一次目的地记忆。
  var _applyRouteData = applyRouteData;
  applyRouteData = function(data, speak) {
    var result = _applyRouteData(data, speak);
    enhanceMemoryFromRoute();
    updateNavigationMetrics();
    return result;
  };

  // 第三批：重写 AI 入口，优先处理明确路线，其次处理导航偏好，再处理 POI。
  var _aiChat = aiChat;
  aiChat = async function(text) {
    text = (text || '').trim();
    if (!text) return;

    var alias = resolveMemoryAlias(text);
    if (alias) {
      document.getElementById('endPoint').value = alias;
      if (document.getElementById('startPoint').value.trim()) {
        await planRoute({speak:false});
        return;
      }
    }

    // 明确的起终点始终优先路线规划，避免“找加油站”等关键词抢走意图。
    if (hasExplicitRouteIntent(text)) {
      return _aiChat(text);
    }

    if (applyNaturalNavigationPreference(text)) return;
    return _aiChat(text);
  };

  // 第四批：真实 GPS 更新时同步导航指标。
  var _onLiveLocation = onLiveLocation;
  onLiveLocation = function(status, result) {
    _onLiveLocation(status, result);
    updateNavigationMetrics();
  };


  // ============================================================
  // 新增模块一：自适应环境语音输入
  // ------------------------------------------------------------
  // 实体硬件环境：调用耀宝本体的 POST /command，由 Python VoiceEngine
  // 完成本地录音与 Vosk 识别。
  // 普通网页环境：恢复浏览器 Web Speech API，不依赖本地 3900 服务。
  // 两种环境最终都继续沿用原有 aiInput → aiChat 业务链，不改变上层意图处理。
  // ============================================================
  (function initVoiceInput() {
    var voiceBtn = document.getElementById('voiceInputBtn');
    if (!voiceBtn) return;

    // ============================================================
    // 普通网页环境：浏览器 Web Speech API 语音识别适配层
    // ------------------------------------------------------------
    // 新增：把原先的浏览器语音识别逻辑放回这里，仅在公网/普通网页环境启用。
    // ============================================================
    function createWebSpeechVoiceProvider() {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      var recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = false;

      return {
        start: function (handlers) {
          handlers = handlers || {};
          recognition.onresult = handlers.onresult || null;
          recognition.onend = handlers.onend || null;
          recognition.onerror = handlers.onerror || null;
          recognition.start();
        },
        stop: function () {
          try { recognition.stop(); } catch (e) {}
        }
      };
    }

    if (!DEVICE_ENV_IS_HARDWARE) {
      var webSpeechProvider = createWebSpeechVoiceProvider();
      if (!webSpeechProvider) {
        // 普通网页环境下若浏览器不支持 Web Speech API，沿用原有行为隐藏话筒按钮。
        voiceBtn.style.display = 'none';
        return;
      }

      var webVoiceTimer = null;
      var webRecording = false;

      function stopWebVoiceUI() {
        webRecording = false;
        voiceBtn.classList.remove('recording');
        voiceBtn.disabled = false;
        clearTimeout(webVoiceTimer);
        webVoiceTimer = null;
      }

      voiceBtn.addEventListener('click', function () {
        if (webRecording) {
          webSpeechProvider.stop();
          stopWebVoiceUI();
          return;
        }

        webRecording = true;
        voiceBtn.disabled = false;
        voiceBtn.classList.add('recording');
        showToast('正在听你说…');

        webVoiceTimer = setTimeout(function () {
          if (!webRecording) return;
          webSpeechProvider.stop();
          stopWebVoiceUI();
          showToast('语音输入已停止');
        }, 10000);

        try {
          webSpeechProvider.start({
            onresult: function (event) {
              var text = '';
              for (var i = event.resultIndex; i < event.results.length; i++) {
                text += event.results[i][0].transcript;
              }
              text = text.trim();
              if (!text) return;

              var input = document.getElementById('aiInput');
              input.value = text;
              setSheetExpanded(true);
              // 识别结果继续进入现有 AI 意图处理链。
              aiChat(text);
              input.value = '';
            },
            onend: function () {
              stopWebVoiceUI();
            },
            onerror: function (event) {
              stopWebVoiceUI();
              if (event && event.error === 'not-allowed') {
                showToast('麦克风权限被拒绝', 'error');
              } else if (event && event.error !== 'aborted') {
                showToast('语音识别失败，请重试', 'error');
              }
            }
          });
        } catch (err) {
          stopWebVoiceUI();
          showToast('无法启动语音输入，请检查麦克风权限', 'error');
        }
      });
      return;
    }

    // ============================================================
    // 实体硬件环境：调用本地 Python VoiceEngine
    // ------------------------------------------------------------
    // 设备无浏览器语音识别能力，因此点击后调用耀宝本体的
    // POST /command {type:"voice"}，由 Python VoiceEngine.listen_once
    // 完成一次最多 10 秒的本地录音与 Vosk 识别。
    // ============================================================
    var recording = false;
    var voiceTimer = null;

    function stopVoiceUI() {
      recording = false;
      voiceBtn.classList.remove('recording');
      voiceBtn.disabled = false;
      clearTimeout(voiceTimer);
      voiceTimer = null;
    }

    voiceBtn.addEventListener('click', async function () {
      if (recording) return;

      recording = true;
      voiceBtn.disabled = true;
      voiceBtn.classList.add('recording');
      showToast('正在听你说…');

      voiceTimer = setTimeout(function () {
        if (recording) showToast('语音采集已达到 10 秒上限');
      }, 10000);

      try {
        var response = await fetchWithTimeout(DEVICE_STATUS_BASE + '/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'voice', seconds: 10 })
        }, 12000);

        var data = await response.json();
        stopVoiceUI();

        if (!response.ok || !data.success) {
          showToast('语音识别失败，请检查耀宝麦克风与本地语音模型', 'error');
          return;
        }

        var text = (data.text || '').trim();
        if (!text) {
          showToast('没有听清，再说一次吧', 'error');
          return;
        }

        var input = document.getElementById('aiInput');
        input.value = text;
        setSheetExpanded(true);
        // 识别结果继续进入现有 AI 意图处理链。
        aiChat(text);
        input.value = '';
      } catch (error) {
        stopVoiceUI();
        if (error && error.name === 'AbortError') {
          showToast('语音采集超时，请检查本地语音服务', 'error');
        } else {
          showToast('无法连接耀宝本地语音服务，请确认 3900 服务已启动', 'error');
        }
      }
    });
  })();

  startDeviceStatusPolling();

  // ============================================================
  // 新增模块二：三路线方案对比
  // ------------------------------------------------------------
  // USE_MOCK_ROUTES=true 时，即使后端仍返回单路线，也会在前端生成三种策略。
  // 后端以后返回 routes 数组时，自动优先使用真实 routes。
  // ============================================================
  var USE_MOCK_ROUTES = true;
  var routeOptions = [];
  var selectedRouteIndex = 0;

  function normalizeRouteOption(item, index) {
    item = item || {};
    var tags = Array.isArray(item.tags) ? item.tags : (item.tags ? [item.tags] : []);
    return {
      planName: item.planName || item.name || ['推荐路线', '省时路线', '舒适路线'][index] || ('方案 ' + (index + 1)),
      tags: tags,
      duration: item.duration == null ? '--' : item.duration,
      distance: item.distance == null ? '--' : item.distance,
      path: Array.isArray(item.path) ? item.path : [],
      redLightCount: item.redLightCount == null ? '--' : item.redLightCount,
      tollFee: item.tollFee == null ? 0 : item.tollFee,
      routeId: item.routeId || ('route_option_' + index + '_' + Date.now())
    };
  }

  function buildMockRoutes(base) {
    var basePath = Array.isArray(base.path) ? base.path : [];
    var duration = Number(base.duration);
    var distance = Number(base.distance);
    return [
      normalizeRouteOption({
        planName: '智能推荐', tags: ['综合最优'], duration: Number.isFinite(duration) ? duration : base.duration,
        distance: Number.isFinite(distance) ? distance : base.distance, path: basePath,
        redLightCount: base.redLightCount == null ? 6 : base.redLightCount, tollFee: base.tollFee == null ? 0 : base.tollFee,
        routeId: (base.routeId || 'route') + '_0'
      }, 0),
      normalizeRouteOption({
        planName: '省时优先', tags: ['时间最短', '高速优先'],
        duration: Number.isFinite(duration) ? Math.max(1, Math.round(duration * 0.88)) : '--',
        distance: Number.isFinite(distance) ? (distance * 1.04).toFixed(1) : base.distance, path: basePath,
        redLightCount: base.redLightCount == null ? 8 : Math.max(0, Number(base.redLightCount) + 2), tollFee: base.tollFee == null ? 15 : Number(base.tollFee) + 15,
        routeId: (base.routeId || 'route') + '_1'
      }, 1),
      normalizeRouteOption({
        planName: '舒适优先', tags: ['少红绿灯', '少收费'],
        duration: Number.isFinite(duration) ? Math.max(1, Math.round(duration * 1.08)) : '--',
        distance: Number.isFinite(distance) ? (distance * 0.98).toFixed(1) : base.distance, path: basePath,
        redLightCount: base.redLightCount == null ? 3 : Math.max(0, Number(base.redLightCount) - 3), tollFee: 0,
        routeId: (base.routeId || 'route') + '_2'
      }, 2)
    ];
  }

  function renderRouteOptions() {
    var box = document.getElementById('routeOptions');
    if (!box || !routeOptions.length) return;
    box.style.display = 'flex';
    box.innerHTML = routeOptions.map(function (r, index) {
      var tags = r.tags.map(function (t) { return '<span class="route-option-tag">' + escapeHtml(t) + '</span>'; }).join('');
      return '<button type="button" class="route-option-card ' + (index === selectedRouteIndex ? 'selected' : '') + '" data-route-index="' + index + '">' +
        '<div class="route-option-top"><span class="route-option-name">' + escapeHtml(r.planName) + '</span>' +
        (index === 0 ? '<span class="route-option-recommend">推荐</span>' : '') + '</div>' +
        '<div class="route-option-metrics"><span class="route-option-time">' + escapeHtml(r.duration) + ' 分钟</span><span class="route-option-distance">约 ' + escapeHtml(r.distance) + ' 公里</span></div>' +
        '<div class="route-option-meta">' + tags + '<span class="route-option-tag">红绿灯 ' + escapeHtml(r.redLightCount) + '</span><span class="route-option-tag">收费 ¥' + escapeHtml(r.tollFee) + '</span></div>' +
        '<div class="route-option-path">点击切换路线，地图将同步显示该方案</div>' +
        '</button>';
    }).join('');
  }

  function drawSelectedRouteOption(index, shouldFit) {
    var option = routeOptions[index];
    if (!option || !map) return;
    selectedRouteIndex = index;
    var path = option.path;
    if (Array.isArray(path) && path.length >= 2) {
      routePath = path;
      if (currentPolyline) map.remove(currentPolyline);
      currentPolyline = new AMap.Polyline({ path: path, strokeColor: currentTheme === 'dark' ? '#0a84ff' : '#007aff', strokeWeight: 7, strokeStyle: 'solid', strokeOpacity: .95, lineJoin: 'round', lineCap: 'round', zIndex: 100 });
      map.add(currentPolyline);
      if (shouldFit && !liveNavigating) map.setFitView([currentPolyline].concat(currentMarkers || []), false, [140, 40, 260, 40]);
    }
    if (currentRouteData) {
      currentRouteData.duration = option.duration;
      currentRouteData.distance = option.distance;
      currentRouteData.routeId = option.routeId;
      currentRouteData.tags = option.tags.slice();
      currentRouteData.redLightCount = option.redLightCount;
      currentRouteData.tollFee = option.tollFee;
      currentRouteData.endLngLat = currentRouteData.endLngLat;
      persistRouteForNavigation();
    }
    renderRouteOptions();
  }

  // 新增：兼容真实 routes 数组和旧版单路线响应。
  var _requestRoutePlanForMulti = requestRoutePlan;
  requestRoutePlan = async function(from, to, tags) {
    var data = await _requestRoutePlanForMulti(from, to, tags);
    if (data && Array.isArray(data.routes) && data.routes.length) {
      data.routes = data.routes.slice(0, 3).map(normalizeRouteOption);
    } else if (USE_MOCK_ROUTES && data) {
      data.routes = buildMockRoutes(data);
    }
    return data;
  };

  // 新增：在原有路线绘制完成后建立三方案卡片，并默认选择推荐方案。
  var _applyRouteDataForMulti = applyRouteData;
  applyRouteData = function(data, speak) {
    var result = _applyRouteDataForMulti(data, speak);
    routeOptions = Array.isArray(data.routes) ? data.routes.slice(0, 3) : [];
    if (routeOptions.length) {
      selectedRouteIndex = 0;
      // 首张卡片复用原接口返回的真实轨迹；后端暂未实现多路线时 mock 三张策略卡。
      routeOptions[0].path = routeOptions[0].path.length ? routeOptions[0].path : routePath.slice();
      drawSelectedRouteOption(0, false);
      renderRouteOptions();
    }
    return result;
  };

  // 新增：三路线卡片点击事件，切换时同步地图路线。
  document.getElementById('routeOptions').addEventListener('click', function (e) {
    var card = e.target.closest('.route-option-card');
    if (!card) return;
    var index = Number(card.getAttribute('data-route-index'));
    if (!Number.isInteger(index) || !routeOptions[index]) return;
    drawSelectedRouteOption(index, true);
    showToast('已切换：' + routeOptions[index].planName, 'success');
  });

  window.onload = function () {
    checkSecureContext();
    loadMapConfigAndInit();
    renderHistory();
    updateTagSelection();
  };

  // 暴露全局（给可能的内联调用）
  window.planRoute = planRoute;
  window.toggleHistory = toggleHistory;
  window.saveRouteToHistory = saveRouteToHistory;
  window.aiChat = aiChat;
  window.searchPoi = searchPoi;

  console.log('✅ 遥望·耀宝 AI 导航系统已加载（搜索 + 状态机 + 实时追踪版）');
</script>
